# Configuración de Codacy (la usan app.codacy.com y el workflow .github/workflows/codacy.yml).
# Solo se analiza el código Python: se excluyen documentos, diagramas, datos y pruebas
# (en las pruebas Bandit marcaría cada "assert" como hallazgo).
---
exclude_paths:
  - "Analisis y planeación/**"
  - "Diseño/**"
  - "**/tests/**"
  - "**/__pycache__/**"
  - "**/*.md"
  - "**/*.puml"
  - "**/*.drawio"
  - "**/*.pdf"
  - "**/*.csv"
  - "**/*.txt"
  - ".github/**"
